<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="momoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="moodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="180" r="140" fill="url(#moodGlow)"/>

  <!-- Cheerful Pebble / Cloud Object Mark -->
  <g transform="translate(250, 180)">
    <!-- Smooth Organic Blob Shape -->
    <path d="M -65,-40 C -85,-15 -90,30 -60,65 C -30,95 30,95 65,65 C 95,35 90,-20 60,-55 C 30,-85 -40,-65 -65,-40 Z" 
          fill="none" stroke="url(#momoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner soft playful fill -->
    <path d="M -65,-40 C -85,-15 -90,30 -60,65 C -30,95 30,95 65,65 C 95,35 90,-20 60,-55 C 30,-85 -40,-65 -65,-40 Z" 
          fill="url(#momoGrad)" opacity="0.12"/>

    <!-- Happy Eyes -->
    <circle cx="-24" cy="-5" r="7" fill="#A78BFA"/>
    <circle cx="24" cy="-5" r="7" fill="#A78BFA"/>
    <!-- Small catchlight -->
    <circle cx="-22" cy="-7" r="2.5" fill="#FFFFFF"/>
    <circle cx="26" cy="-7" r="2.5" fill="#FFFFFF"/>

    <!-- Warm joyful Smile -->
    <path d="M -22,22 Q 0,44 22,22" fill="none" stroke="url(#momoGrad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Cheerful rosy cheeks -->
    <ellipse cx="-42" cy="16" rx="9" ry="5" fill="#F472B6" opacity="0.5"/>
    <ellipse cx="42" cy="16" rx="9" ry="5" fill="#F472B6" opacity="0.5"/>
  </g>

  <!-- Typography -->
  <text x="250" y="365" font-family="'Geist', 'Inter', -apple-system, sans-serif" font-size="46" font-weight="700" letter-spacing="0.3em" fill="#FFFFFF" text-anchor="middle">MOMO</text>
  <text x="250" y="405" font-family="'Geist Mono', monospace" font-size="13" font-weight="500" letter-spacing="0.26em" fill="#A78BFA" text-anchor="middle">SMALL OBJECTS · GOOD MOODS</text>
  <text x="250" y="432" font-family="'Geist Mono', monospace" font-size="11" font-weight="400" letter-spacing="0.22em" fill="rgba(255,255,255,0.45)" text-anchor="middle">MONTREAL, QC</text>
</svg>