<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B193"/>
      <stop offset="50%" stop-color="#C28E73"/>
      <stop offset="100%" stop-color="#8F5E46"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C28E73" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C28E73" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="180" r="140" fill="url(#warmGlow)"/>

  <!-- Architectural Stoneware Vessel Mark -->
  <g transform="translate(250, 180)" stroke="url(#clayGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vessel Rim -->
    <ellipse cx="0" cy="-90" rx="42" ry="10" stroke-width="3" fill="#1C1816"/>
    <!-- Neck -->
    <path d="M -32,-85 Q -25,-55 -45,-30 Q -70,5 -65,45 Q -60,85 0,90 Q 60,85 65,45 Q 70,5 45,-30 Q 25,-55 32,-85" stroke-width="3.5" fill="none"/>
    <!-- Wheel Throwing Ridges -->
    <path d="M -48,-15 Q 0,-5 48,-15" stroke-width="2" opacity="0.6"/>
    <path d="M -60,25 Q 0,40 60,25" stroke-width="2" opacity="0.6"/>
    <path d="M -50,60 Q 0,72 50,60" stroke-width="1.8" opacity="0.5"/>
    <!-- Artisan Seal Accent -->
    <circle cx="0" cy="18" r="8" fill="url(#clayGrad)" stroke="none"/>
    <!-- Subtle firing temperature indicator -->
    <ellipse cx="0" cy="90" rx="35" ry="8" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="250" y="365" font-family="'Geist', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="600" letter-spacing="0.32em" fill="#FFFFFF" text-anchor="middle">HELIO</text>
  <text x="250" y="405" font-family="'Geist Mono', monospace" font-size="13" font-weight="500" letter-spacing="0.28em" fill="#C28E73" text-anchor="middle">KILN · CERAMIC ATELIER</text>
  <text x="250" y="432" font-family="'Geist Mono', monospace" font-size="11" font-weight="400" letter-spacing="0.22em" fill="rgba(255,255,255,0.45)" text-anchor="middle">KYOTO &amp; LISBON · 1,260°C</text>
</svg>