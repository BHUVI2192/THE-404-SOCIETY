<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="mikanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Subtle circular aura -->
  <circle cx="250" cy="180" r="140" fill="url(#sunGlow)"/>
  
  <!-- Outer precision geometric ring -->
  <circle cx="250" cy="180" r="105" fill="none" stroke="url(#mikanGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="250" cy="180" r="95" fill="none" stroke="url(#mikanGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Citrus Segments / Radial Mon Crest -->
  <g transform="translate(250, 180)">
    <!-- 8 Citrus Segments -->
    <!-- Seg 0 -->
    <path d="M 0,-80 A 80 80 0 0 1 56,-56 L 18,-18 A 25 25 0 0 0 0,-25 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 1 -->
    <path d="M 56,-56 A 80 80 0 0 1 80,0 L 25,0 A 25 25 0 0 0 18,-18 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 2 -->
    <path d="M 80,0 A 80 80 0 0 1 56,56 L 18,18 A 25 25 0 0 0 25,0 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 3 -->
    <path d="M 56,56 A 80 80 0 0 1 0,80 L 0,25 A 25 25 0 0 0 18,18 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 4 -->
    <path d="M 0,80 A 80 80 0 0 1 -56,56 L -18,18 A 25 25 0 0 0 0,25 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 5 -->
    <path d="M -56,56 A 80 80 0 0 1 -80,0 L -25,0 A 25 25 0 0 0 -18,18 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 6 -->
    <path d="M -80,0 A 80 80 0 0 1 -56,-56 L -18,-18 A 25 25 0 0 0 -25,0 Z" fill="url(#mikanGrad)"/>
    <!-- Seg 7 -->
    <path d="M -56,-56 A 80 80 0 0 1 0,-80 L 0,-25 A 25 25 0 0 0 -18,-18 Z" fill="url(#mikanGrad)"/>
    <!-- Core seed/pip star -->
    <circle cx="0" cy="0" r="10" fill="#FFA928"/>
  </g>

  <!-- Typography -->
  <text x="250" y="365" font-family="'Geist', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="0.28em" fill="#FFFFFF" text-anchor="middle">MIKAN</text>
  <text x="250" y="405" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.32em" fill="#FF8A00" text-anchor="middle">蜜柑 · SPARKLING CITRUS</text>
  <text x="250" y="432" font-family="'Geist Mono', monospace" font-size="11" font-weight="400" letter-spacing="0.22em" fill="rgba(255,255,255,0.45)" text-anchor="middle">SETOUCHI · EHIME</text>
</svg>