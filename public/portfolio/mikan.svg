<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMikan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1546D9"/>
      <stop offset="100%" stop-color="#0E2E8C"/>
    </linearGradient>
    <radialGradient id="tangerineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC83B"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bgMikan)"/>
  
  <!-- Tangerine / Citrus Sun Motif -->
  <g transform="translate(256, 210)">
    <!-- Outer Citrus Ring -->
    <circle r="120" fill="url(#tangerineGlow)" />
    <circle r="102" fill="#FFFFFF" fill-opacity="0.95" />
    <circle r="92" fill="#F97316" />
    
    <!-- Citrus Segments -->
    <path d="M0,0 L-40,-75 A85,85 0 0,1 40,-75 Z" fill="#FDBA74" opacity="0.9"/>
    <path d="M0,0 L75,-40 A85,85 0 0,1 75,40 Z" fill="#FDBA74" opacity="0.9"/>
    <path d="M0,0 L40,75 A85,85 0 0,1 -40,75 Z" fill="#FDBA74" opacity="0.9"/>
    <path d="M0,0 L-75,40 A85,85 0 0,1 -75,-40 Z" fill="#FDBA74" opacity="0.9"/>
    
    <!-- Center core and sparkling bubbles -->
    <circle r="16" fill="#FFFFFF"/>
    <circle cx="-50" cy="-35" r="7" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="45" cy="-45" r="9" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="55" cy="30" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="-35" cy="50" r="8" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Sparkle Stars -->
    <path d="M-80,-70 Q-70,-70 -70,-80 Q-70,-70 -60,-70 Q-70,-70 -70,-60 Q-70,-70 -80,-70 Z" fill="#FFEDB3"/>
    <path d="M75,-75 Q82,-75 82,-82 Q82,-75 89,-75 Q82,-75 82,-68 Q82,-75 75,-75 Z" fill="#FFEDB3"/>
  </g>
  
  <!-- MIKAN Bold Swiss Typography -->
  <text x="256" y="395" text-anchor="middle" font-family="'Anton', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="0.14em" fill="#FFFFFF">MIKAN</text>
  <text x="256" y="432" text-anchor="middle" font-family="'DM Mono', monospace" font-weight="500" font-size="16" letter-spacing="0.32em" fill="#FDBA74">SPARKLING CITRUS</text>
</svg>
